[package]
authors = ["pleme-io"]
description = "Deployment instance layer for the lava suite. deflava-stack form. Maps architecture + workspace + backend to one Terraform workspace. Variable overrides per environment. Pangea-stack analog."
edition = "2024"
license = "MIT"
name = "lava-stack"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-stack"
version = "0.1.7"

[lib]
name = "lava_stack"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-core = { git = "https://github.com/pleme-io/lava-core", branch = "main" }
lava-arch = { git = "https://github.com/pleme-io/lava-arch", branch = "main" }
lava-schema = { git = "https://github.com/pleme-io/lava-schema", branch = "main" }

[dev-dependencies]
lava-types = { git = "https://github.com/pleme-io/lava-types", branch = "main" }
